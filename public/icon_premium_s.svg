<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with a premium deep gradient -->
  <rect width="512" height="512" rx="114" fill="url(#bg_grad)"/>
  
  <!-- Outer Glow Ring (Signal/Premium feel) -->
  <circle cx="256" cy="256" r="190" stroke="url(#ring_grad)" stroke-width="4" opacity="0.3"/>
  
  <!-- Stylized "S" integrated with Radio Waves -->
  <g filter="url(#glow)">
    <!-- Signal Waves (Israeli Blue touch) -->
    <path d="M160 256C160 200 200 160 256 160" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" opacity="0.8"/>
    <path d="M352 256C352 312 312 352 256 352" stroke="#60a5fa" stroke-width="24" stroke-linecap="round" opacity="0.8"/>
    
    <!-- The "S" forming a Waveform -->
    <path d="M210 180C210 180 320 140 320 220C320 300 192 212 192 292C192 372 302 332 302 332" 
          stroke="white" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Core Signal Point -->
    <circle cx="256" cy="256" r="12" fill="white"/>
  </g>

  <!-- Accent Detail (Premium Gold/Orange) -->
  <circle cx="410" cy="100" r="15" fill="#f59e0b"/>

  <defs>
    <filter id="glow" x="120" y="120" width="272" height="272" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="ring_grad" x1="256" y1="66" x2="256" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>
